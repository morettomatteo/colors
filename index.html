<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colors @ Morettoweb</title>
<meta name="description" content="Generate, save and copy color palettes.">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
  :root {
    --bg: #f6f6f4;
    --surface: #ffffff;
    --ink: #17181b;
    --muted: #5f636b;
    --line: #dedfe2;
    --accent: #2f5bea;
    --radius: 10px;
    --font: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101113; --surface: #17181b; --ink: #ededee; --muted: #9a9ea6; --line: #2b2d32; --accent: #7b9bff;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101113; --surface: #17181b; --ink: #ededee; --muted: #9a9ea6; --line: #2b2d32; --accent: #7b9bff;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 1.5px solid var(--accent); outline-offset: 1px; }

  .wrap { max-width: 1400px; margin: 0 auto; padding: 0 24px; }

  /* Header */
  header { height: 64px; display: flex; align-items: center; }
  header .wrap { display: flex; align-items: center; justify-content: space-between; width: 100%; }
  .brand { font-weight: 600; letter-spacing: -0.02em; font-size: 18px; display: flex; align-items: center; gap: 10px; }
  .brand i { font-size: 22px; }
  .head-actions { display: flex; gap: 8px; }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    height: 40px; padding: 2px 16px 0; white-space: nowrap;
    border-radius: var(--radius); border: 1px solid var(--line);
    background: var(--surface); transition: transform .2s var(--ease), background .2s;
  }
  .btn:hover { background: color-mix(in srgb, var(--surface) 88%, var(--ink)); }
  .btn:active { transform: scale(0.98); }
  .btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .btn.primary:hover { background: color-mix(in srgb, var(--ink) 85%, var(--bg)); }
  .btn.icon { width: 40px; padding: 0; justify-content: center; }
  kbd {
    font-family: var(--mono); font-size: 12px; padding: 1px 6px;
    border: 1px solid currentColor; border-radius: 6px; opacity: .6;
  }

  /* Palette editor */
  .strip {
    display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
    height: min(62dvh, 560px); min-height: 380px;
    border-radius: 16px; overflow: hidden; border: 1px solid var(--line);
  }
  .col {
    position: relative; display: flex; flex-direction: column; justify-content: flex-end;
    align-items: center; gap: 20px; padding: 28px 8px;
    background: var(--c); color: var(--fg);
    transition: background-color .35s var(--ease);
  }
  .hex {
    background: none; border: 0; border-radius: var(--radius); padding: 6px 12px;
    font-family: var(--mono); font-size: clamp(15px, 1.7vw, 24px); font-weight: 500; letter-spacing: 0.02em;
    text-transform: uppercase; color: inherit;
  }
  .hex:hover { background: color-mix(in srgb, var(--fg) 12%, transparent); }
  .tools { display: flex; flex-direction: column; gap: 4px; opacity: 0; transition: opacity .2s; }
  .col:hover .tools, .col:focus-within .tools, .col.locked .tools { opacity: 1; }
  @media (hover: none) { .tools { opacity: 1; } }
  .tool {
    width: 40px; height: 40px; display: grid; place-items: center; font-size: 20px;
    background: none; border: 0; border-radius: var(--radius); color: inherit;
  }
  .tool:hover { background: color-mix(in srgb, var(--fg) 14%, transparent); }
  .tool:active { transform: scale(0.94); }
  .col :focus-visible { outline-color: var(--fg); }
  .col + .col { box-shadow: inset 1px 0 0 color-mix(in srgb, var(--fg) 10%, transparent); }
  @media (max-width: 767px) { .col + .col { box-shadow: inset 0 1px 0 color-mix(in srgb, var(--fg) 10%, transparent); } }
  .label { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 100%; }
  .cname {
    width: 90%; max-width: 180px; text-align: center; background: none; border: 1px solid transparent;
    border-radius: var(--radius); padding: 4px 8px; color: inherit; font-weight: 500; font-size: 14px;
  }
  .cname::placeholder { color: color-mix(in srgb, var(--fg) 62%, transparent); }
  .cname:hover { border-color: color-mix(in srgb, var(--fg) 25%, transparent); }
  .cname:focus-visible { outline-color: var(--fg); }
  .picker { position: absolute; width: 0; height: 0; opacity: 0; pointer-events: none; }

  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; padding: 16px 0 40px; }
  .bar .group { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .count { font-family: var(--mono); min-width: 2ch; text-align: center; }
  .stepper, .stepper-ctrl { display: flex; align-items: center; gap: 8px; }
  .stepper-label { display: none; color: var(--muted); font-size: 14px; }
  .hint { color: var(--muted); font-size: 14px; }

  /* Saved */
  h2 { font-size: 22px; letter-spacing: -0.02em; margin: 0 0 20px; font-weight: 600; }
  .saved-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; padding-bottom: 80px; }
  .card { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px; }
  .mini { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; height: 84px; border-radius: var(--radius); overflow: hidden; }
  .mini button {
    border: 0; background: var(--c); color: var(--fg); font-family: var(--mono); font-size: 11px;
    text-transform: uppercase; display: grid; place-items: end center; padding-bottom: 8px; transition: flex .2s;
    opacity: 1;
  }
  .mini button span { opacity: 0; transition: opacity .15s; }
  .mini button:hover span, .mini button:focus-visible span { opacity: 1; }
  .mini button:focus-visible { outline-color: var(--fg); outline-offset: -2px; }
  .card-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 4px 2px; }
  .card-name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-date { color: var(--muted); font-size: 13px; }
  .card-actions { display: flex; gap: 2px; }
  .card-actions .btn { border-color: transparent; background: none; height: 36px; width: 36px; }
  .card-actions .btn:hover { background: color-mix(in srgb, var(--surface) 85%, var(--ink)); }
  .empty {
    border: 1px dashed var(--line); border-radius: 14px; padding: 48px 24px; text-align: center; color: var(--muted);
    grid-column: 1 / -1;
  }
  .empty strong { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }

  /* Save dialog */
  dialog {
    border: 1px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--ink);
    padding: 24px; width: min(420px, calc(100vw - 32px));
  }
  dialog::backdrop { background: rgb(10 10 12 / 0.5); }
  dialog label { display: block; font-weight: 500; margin-bottom: 8px; }
  dialog input[type=text] {
    width: 100%; height: 44px; padding: 0 14px; background: var(--bg); border: 1px solid var(--line);
    border-radius: var(--radius);
  }
  dialog input[type=text]::placeholder { color: var(--muted); }
  dialog .help { color: var(--muted); font-size: 13px; margin: 8px 0 20px; }
  dialog .row { display: flex; gap: 8px; justify-content: flex-end; }
  dialog .mini { margin-bottom: 20px; height: 56px; }

  /* Toast */
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 24px); opacity: 0; pointer-events: none;
    background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: var(--radius);
    display: flex; align-items: center; gap: 8px; font-size: 14px;
    transition: transform .3s var(--ease), opacity .3s; z-index: 100;
  }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }
  .toast.show.has-act { pointer-events: auto; }
  .toast-act { background: none; border: 0; color: inherit; font-weight: 600; text-decoration: underline; padding: 0 0 0 8px; }
  .editing {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    padding: 10px 14px; margin-bottom: 12px; border: 1px solid var(--accent); border-radius: var(--radius);
    background: color-mix(in srgb, var(--accent) 8%, transparent);
  }
  .editing[hidden] { display: none; }
  .card.is-editing { border-color: var(--accent); }
  .name-input {
    width: 100%; height: 32px; padding: 0 8px; background: var(--bg); color: var(--ink);
    border: 1px solid var(--accent); border-radius: 8px;
  }
  .toast .toast-sw { flex: none; width: 14px; height: 14px; border-radius: 4px; border: 1px solid color-mix(in srgb, var(--bg) 40%, transparent); }

  /* Color detail view */
  .detail { position: fixed; inset: 0; z-index: 60; background: var(--bg); overflow: auto; }
  .detail[hidden] { display: none; }
  .d-head { height: 64px; display: flex; align-items: center; }
  .d-head .wrap { width: 100%; display: flex; align-items: center; justify-content: space-between; }
  .d-hero {
    background: var(--c); color: var(--fg); min-height: clamp(300px, 42dvh, 400px);
    border: 1px solid var(--line); border-radius: 16px; padding: 28px 32px;
    display: flex; flex-direction: column; justify-content: flex-end; transition: background-color .35s var(--ease);
  }
  .d-hero :focus-visible { outline-color: var(--fg); }
  .d-nav { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 13px; }
  .d-main { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
  .d-name {
    width: min(420px, 100%); background: none; border: 0; border-bottom: 1px solid color-mix(in srgb, var(--fg) 30%, transparent);
    color: inherit; font-size: 22px; font-weight: 500; padding: 4px 0; border-radius: 0;
  }
  .d-name::placeholder { color: color-mix(in srgb, var(--fg) 62%, transparent); }
  .d-hex {
    font-family: var(--mono); font-size: clamp(40px, 6.5vw, 76px); line-height: 1; letter-spacing: -0.01em; font-weight: 500;
    text-transform: uppercase; background: none; border: 0; padding: 0; color: inherit; border-radius: var(--radius);
  }
  .d-closest[hidden] { display: none; }
  .d-closest { font-size: 14px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .d-link { background: none; border: 0; padding: 0; color: inherit; text-decoration: underline; font-weight: 500; }
  .d-row2 { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
  .d-field {
    display: flex; align-items: center; gap: 4px; height: 40px; padding: 0 12px; border-radius: var(--radius);
    border: 1px solid color-mix(in srgb, var(--fg) 35%, transparent); font-family: var(--mono);
  }
  .d-field input { width: 84px; background: none; border: 0; color: inherit; font-family: var(--mono); text-transform: uppercase; outline: none; }
  .d-field:focus-within { outline: 1.5px solid var(--fg); outline-offset: 1px; }
  #dPicker::-webkit-color-swatch-wrapper { padding: 4px; }
  #dPicker::-webkit-color-swatch { border: 0; border-radius: 6px; }
  #dPicker::-moz-color-swatch { border: 0; border-radius: 6px; }
  #dPicker { width: 40px; height: 40px; padding: 0; border: 1px solid color-mix(in srgb, var(--fg) 35%, transparent); border-radius: var(--radius); background: none; cursor: pointer; }
  .d-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 2px 14px 0;
    border-radius: var(--radius); background: none; color: inherit; white-space: nowrap;
    border: 1px solid color-mix(in srgb, var(--fg) 35%, transparent); transition: background .2s, transform .2s var(--ease);
  }
  .d-btn.icon { width: 40px; padding: 0; font-size: 18px; }
  .d-btn:hover { background: color-mix(in srgb, var(--fg) 12%, transparent); }
  .d-btn:active { transform: scale(0.98); }
  .d-btn.fill { background: var(--fg); color: var(--c); border-color: var(--fg); }
  .d-btn.fill:hover { background: color-mix(in srgb, var(--fg) 88%, var(--c)); }
  .d-btn:disabled { opacity: .45; cursor: default; }
  .d-tabs { position: sticky; top: 0; z-index: 1; background: var(--bg); border-bottom: 1px solid var(--line); }
  .d-tabs .wrap { display: flex; gap: 4px; overflow-x: auto; }
  .d-tab { height: 52px; padding: 0 14px; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); white-space: nowrap; }
  .d-tab:hover { color: var(--ink); }
  .d-tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 500; }
  .d-body { padding-top: 32px; padding-bottom: 80px; display: grid; gap: 40px; }
  .d-row-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .d-row h3 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
  .d-row p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
  .d-row .btn { height: 36px; }
  /* rows with an action button keep it on the right, never wrapping below the title */
  .d-row-head.keep { flex-wrap: nowrap; align-items: center; }
  .d-row-head.keep > div { min-width: 0; }
  .pal-btn { flex: none; }
  @media (max-width: 767px) {
    .pal-btn { width: 36px; padding: 0; justify-content: center; }
    .pal-btn .pal-label { display: none; }
  }
  .sw-grid { display: grid; grid-template-columns: repeat(var(--n), 1fr); border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
  .sw { position: relative; display: flex; min-height: 120px; background: var(--c); color: var(--fg); }
  .sw-check { display: block; line-height: 0; }
  .sw-check i { font-size: 22px; }
  .sw-main {
    flex: 1; min-width: 0; background: none; border: 0; color: inherit; text-align: left; padding: 10px;
    display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start;
  }
  .sw-main em { font-style: normal; font-size: 12px; }
  .sw-main span { font-family: var(--mono); font-size: 12px; text-transform: uppercase; }
  .sw-main:focus-visible { outline-color: var(--fg); outline-offset: -3px; }
  .sw-open {
    position: absolute; top: 6px; right: 6px; width: 32px; height: 32px; display: grid; place-items: center;
    border: 0; border-radius: 8px; background: none; color: inherit; font-size: 18px; opacity: 0; transition: opacity .15s;
  }
  .sw-open:hover { background: color-mix(in srgb, var(--fg) 14%, transparent); }
  .sw:hover .sw-open, .sw-open:focus-visible { opacity: 1; }
  .sw-open:focus-visible { outline-color: var(--fg); }
  @media (hover: none) { .sw-open { opacity: 1; } }
  .d-actions-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .pf { display: grid; gap: 6px; max-width: 300px; margin-bottom: 16px; }
  .pf span { font-weight: 500; font-size: 14px; }
  .pf input {
    height: 40px; padding: 0 12px; background: var(--surface); color: var(--ink); font-family: var(--mono);
    border: 1px solid var(--line); border-radius: var(--radius);
  }
  .pf input::placeholder { color: var(--muted); }
  .code {
    margin: 0; padding: 16px 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface);
    font-family: var(--mono); font-size: 13px; line-height: 1.6; overflow: auto; max-height: 340px; white-space: pre;
  }
  .chk { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); cursor: pointer; }
  .chk input { width: 16px; height: 16px; accent-color: var(--accent); }
  .ct-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .ct { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--surface); }
  .ct-sample { padding: 18px 20px; display: flex; align-items: baseline; gap: 12px; min-height: 84px; }
  .ct-sample b { font-size: 32px; font-weight: 600; }
  .ct-meta { padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
  .ct-meta strong { font-family: var(--mono); margin-right: 4px; }
  .ct-label { color: var(--muted); font-size: 13px; width: 100%; }
  .pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 2px 8px; border: 1px solid var(--line); border-radius: 6px; }
  .pill.fail { color: var(--muted); text-decoration: line-through; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .conv-split { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 767px) { .conv-split { grid-template-columns: 1fr; } }
  .conv-table { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--surface); }
  .conv-row {
    width: 100%; display: grid; grid-template-columns: 110px 1fr 24px; align-items: center; gap: 12px;
    padding: 14px 18px; background: none; border: 0; text-align: left; transition: background .2s;
  }
  .conv-row + .conv-row { border-top: 1px solid var(--line); }
  .conv-row:hover { background: color-mix(in srgb, var(--surface) 92%, var(--ink)); }
  .conv-row:focus-visible { outline-offset: -2px; }
  .conv-row span { color: var(--muted); font-size: 14px; }
  .conv-row b { font-family: var(--mono); font-weight: 500; font-size: 15px; overflow-wrap: anywhere; }
  .conv-row i { color: var(--muted); font-size: 18px; opacity: 0; transition: opacity .15s; }
  .conv-row:hover i, .conv-row:focus-visible i { opacity: 1; }
  @media (hover: none) { .conv-row i { opacity: 1; } }

  @media (max-width: 767px) {
    .sw-grid { grid-template-columns: repeat(var(--m), 1fr); }
    .sw { min-height: 92px; }
    .sw-main { padding: 8px; }
    .sw-main em { font-size: 11px; }
    .sw-main span { font-size: 11px; }
    .sw-grid .sw:last-child { grid-column: span var(--ls, 1); }
    .d-hero { padding: 20px; min-height: 300px; }
    .d-body { gap: 32px; }
  }
  @media (max-width: 767px) {
    .wrap { padding: 0 16px; }
    .strip { grid-auto-flow: row; height: auto; min-height: 0; }
    .col { flex-direction: row; align-items: center; justify-content: space-between; min-height: 76px; padding: 8px 6px 8px 12px; gap: 8px; }
    .label { order: -1; flex: 1; min-width: 0; width: auto; align-items: flex-start; }
    .tools { flex-direction: row; flex: none; opacity: 1; gap: 0; }
    .tool { width: 40px; height: 44px; }
    .tool[data-icon="ph-copy"] { display: none; }
    .hex { font-size: 18px; padding: 4px 8px; margin-left: -8px; }
    .cname { text-align: left; width: 100%; max-width: 200px; margin-left: -8px; }
    .hide-sm { display: none; }
    .bar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px 0 32px; }
    .bar .group { display: contents; }
    .bar .btn { justify-content: center; }
    .stepper {
      grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between;
      height: 48px; padding: 0 4px 0 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface);
    }
    .stepper .stepper-label { display: block; }
    .stepper .btn.icon { border-color: transparent; background: none; }
    .stepper-ctrl { display: flex; align-items: center; gap: 4px; }
    .count { min-width: 3ch; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand"><i class="ph ph-palette" aria-hidden="true"></i>Colors</div>
    <div class="head-actions">
      <button class="btn" id="themeBtn" aria-label="Toggle theme"><i class="ph ph-circle-half" aria-hidden="true"></i></button>
      <button class="btn primary" id="saveBtn"><i class="ph ph-bookmark-simple" aria-hidden="true"></i>Save palette</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section aria-label="Current palette">
    <div class="editing" id="editing" hidden>
      <span>Editing <strong id="editingName"></strong></span>
      <button class="btn" id="stopEditBtn" style="height:32px">Stop editing</button>
    </div>
    <div class="strip" id="strip"></div>
    <div class="bar">
      <div class="group">
        <button class="btn primary" id="genBtn"><i class="ph ph-shuffle" aria-hidden="true"></i>Generate <kbd class="hide-sm">Space</kbd></button>
        <button class="btn" id="newBtn"><i class="ph ph-file-plus" aria-hidden="true"></i>New palette</button>
        <div class="stepper">
          <span class="stepper-label">Colors in palette</span>
          <div class="stepper-ctrl">
            <button class="btn icon" id="minusBtn" aria-label="Remove a color"><i class="ph ph-minus" aria-hidden="true"></i></button>
            <span class="count" id="count" aria-live="polite">5</span>
            <button class="btn icon" id="plusBtn" aria-label="Add a color"><i class="ph ph-plus" aria-hidden="true"></i></button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section aria-labelledby="savedTitle">
    <h2 id="savedTitle">Saved palettes</h2>
    <div class="saved-grid" id="saved"></div>
  </section>
</main>

<dialog id="dlg">
  <form method="dialog" id="saveForm">
    <div id="dlgPreview" aria-hidden="true"></div>
    <label for="nameInput">Palette name</label>
    <input type="text" id="nameInput" maxlength="40" autocomplete="off" placeholder="Spring campaign">
    <p class="help">Leave it blank and we will name it for you.</p>
    <div class="row">
      <button class="btn" id="cancelBtn" type="button">Cancel</button>
      <button class="btn" id="asNewBtn" type="submit" data-mode="new" hidden>Save as new</button>
      <button class="btn primary" id="okBtn" type="submit" data-mode="main">Save</button>
    </div>
  </form>
</dialog>

<div class="detail" id="detail" role="dialog" aria-modal="true" aria-label="Color details" hidden>
  <div class="d-head">
    <div class="wrap">
      <button class="btn" id="dClose" aria-label="Close color details"><i class="ph ph-arrow-left" aria-hidden="true"></i>Back</button>
      <div class="d-nav">
        <button class="btn icon" id="dPrev" aria-label="Previous color"><i class="ph ph-caret-left" aria-hidden="true"></i></button>
        <span id="dCount">1 / 5</span>
        <button class="btn icon" id="dNext" aria-label="Next color"><i class="ph ph-caret-right" aria-hidden="true"></i></button>
      </div>
    </div>
  </div>
  <div class="wrap">
    <div class="d-hero" id="dHero">
      <div class="d-main">
        <input class="d-name" id="dName" type="text" maxlength="30" placeholder="Name this color" autocomplete="off" spellcheck="false" aria-label="Color name">
        <button class="d-hex" id="dHex" aria-label="Copy hex"></button>
        <div class="d-closest" id="dClosestRow" hidden><span id="dClosestText"></span><button class="d-link" id="dUseName">Use as name</button></div>
        <div class="d-row2">
          <label class="d-field"><span>#</span><input id="dHexInput" type="text" maxlength="7" autocomplete="off" spellcheck="false" aria-label="Hex value"></label>
          <input type="color" id="dPicker" aria-label="Pick a color">
          <button class="d-btn" id="dReset" hidden><i class="ph ph-arrow-counter-clockwise" aria-hidden="true"></i>Reset</button>
          <button class="d-btn" id="dCopy"><i class="ph ph-copy" aria-hidden="true"></i>Copy hex</button>
          <button class="d-btn fill" id="dApply"><i class="ph ph-check" aria-hidden="true"></i>Apply to palette</button>
        </div>
      </div>
    </div>
  </div>
  <div class="d-tabs"><div class="wrap" id="dTabs" role="tablist"></div></div>
  <div class="wrap d-body" id="dBody"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"><span class="toast-sw" id="toastSw"></span><span id="toastMsg"></span><button class="toast-act" id="toastAct" hidden>Undo</button></div>

<script>
(function () {
  "use strict";
  var MIN = 2, MAX = 8;
  var KEY = "swatchbook.saved.v1", THEME_KEY = "swatchbook.theme";
  var $ = function (id) { return document.getElementById(id); };

  var current = [];
  var saved = load();
  var editingId = null;

  /* ---------- color helpers ---------- */
  function hslToHex(h, s, l) {
    h = ((h % 360) + 360) % 360; s /= 100; l /= 100;
    var k = function (n) { return (n + h / 30) % 12; };
    var a = s * Math.min(l, 1 - l);
    var f = function (n) { return l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1))); };
    return "#" + [f(0), f(8), f(4)].map(function (x) {
      return Math.round(x * 255).toString(16).padStart(2, "0");
    }).join("");
  }
  function hexToHue(hex) {
    var r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255, b = parseInt(hex.slice(5, 7), 16) / 255;
    var max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min, h = 0;
    if (d) {
      if (max === r) h = ((g - b) / d) % 6; else if (max === g) h = (b - r) / d + 2; else h = (r - g) / d + 4;
      h *= 60;
    }
    return (h + 360) % 360;
  }
  function lum(hex) {
    var c = [1, 3, 5].map(function (i) {
      var v = parseInt(hex.slice(i, i + 2), 16) / 255;
      return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  }
  function fgFor(hex) { return lum(hex) > 0.36 ? "#17181b" : "#f6f6f4"; }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function normHex(v) {
    v = String(v).trim().replace(/^#/, "");
    if (/^[0-9a-f]{3}$/i.test(v)) v = v.split("").map(function (c) { return c + c; }).join("");
    return /^[0-9a-f]{6}$/i.test(v) ? "#" + v.toLowerCase() : null;
  }

  function generate(count, baseHue) {
    var h0 = baseHue == null ? rand(0, 360) : baseHue;
    var schemes = [
      [0, 18, 36, 54, 72],        // analogous
      [0, 24, 180, 204, 156],     // complementary
      [0, 120, 240, 20, 140],     // triad
      [0, 8, 16, 24, 32],         // tight mono
      [0, 40, 160, 200, 320]      // split
    ];
    var offs = schemes[Math.floor(Math.random() * schemes.length)];
    var sBase = rand(42, 78);
    var out = [];
    for (var i = 0; i < count; i++) {
      var l = 90 - (i * (70 / Math.max(count - 1, 1))) + rand(-5, 5);
      out.push(hslToHex(h0 + offs[i % offs.length] + rand(-6, 6), sBase + rand(-14, 14), Math.max(14, Math.min(92, l))));
    }
    // shuffle so lightness is not always a perfect ramp
    if (Math.random() < 0.5) out.reverse();
    return out;
  }

  /* ---------- storage ---------- */
  function load() {
    try {
      var v = JSON.parse(localStorage.getItem(KEY));
      if (!Array.isArray(v)) return [];
      // older saves stored plain hex strings; upgrade them to {hex, name}
      v.forEach(function (p) {
        p.colors = (p.colors || []).map(function (c) { return typeof c === "string" ? { hex: c, name: "" } : c; });
      });
      return v;
    } catch (e) { return []; }
  }
  function persist() { try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) {} }

  /* ---------- clipboard + toast ---------- */
  var toastTimer;
  var toastAction = null;
  function toast(msg, swatch, action) {
    $("toastMsg").textContent = msg;
    var sw = $("toastSw");
    sw.style.display = swatch ? "block" : "none";
    if (swatch) sw.style.background = swatch;
    toastAction = action || null;
    $("toastAct").hidden = !action;
    if (action) $("toastAct").textContent = action.label;
    $("toast").classList.toggle("has-act", !!action);
    $("toast").classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { $("toast").classList.remove("show"); }, action ? 6000 : 1600);
  }
  $("toastAct").addEventListener("click", function () {
    if (toastAction) toastAction.fn();
    $("toast").classList.remove("show");
  });
  function copy(text, msg, swatch) {
    var done = function () { toast(msg, swatch); };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done, function () { fallback(text); done(); });
    } else { fallback(text); done(); }
  }
  function fallback(text) {
    var t = document.createElement("textarea");
    t.value = text; t.style.position = "fixed"; t.style.opacity = "0";
    document.body.appendChild(t); t.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(t);
  }
  // Webflow-friendly: lowercase kebab-case names, unique, 6-digit lowercase hex, plain :root block (no comments).
  function slug(s) {
    s = String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase()
      .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    if (/^[0-9]/.test(s)) s = "color-" + s;
    return s;
  }
  // With scales on, every color also gets --name-50 ... --name-950 steps.
  function cssVars(colors, scales) {
    var used = {}, out = [];
    var uniq = function (base) {
      var n = base, k = 2;
      while (used[n]) n = base + "-" + (k++);
      used[n] = true;
      return n;
    };
    colors.forEach(function (c, i) {
      // unnamed colors fall back to their closest CSS color name
      var base = uniq(slug(c.name) || slug(closestName(c.hex).name) || "color-" + (i + 1));
      if (scales && i > 0) out.push("");
      out.push("  --" + base + ": " + c.hex.toLowerCase() + ";");
      if (scales) scaleOf(c.hex).forEach(function (x) { out.push("  --" + uniq(base + "-" + x.step) + ": " + x.hex + ";"); });
    });
    return ":root {\n" + out.join("\n") + "\n}";
  }
  function scaleCss(prefix, hex) {
    var lines = scaleOf(hex).map(function (x) { return "  --" + prefix + "-" + x.step + ": " + x.hex + ";"; });
    return ":root {\n" + lines.join("\n") + "\n}";
  }
  // 50-950 scale anchored on the given color: the step whose lightness is closest to it keeps the exact hex,
  // lighter steps ease toward near-white, darker steps toward near-black, with slightly less saturation at the ends.
  var STEPS = [50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 950];
  var STEP_L = [97, 94, 86, 77, 66, 55, 46, 38, 30, 22, 14];
  function scaleOf(hex) {
    var c = hslOf(hex), h = c[0], s = c[1], l = c[2], a = 0, best = Infinity;
    STEP_L.forEach(function (t, i) { var d = Math.abs(t - l); if (d < best) { best = d; a = i; } });
    var La = STEP_L[a];
    return STEPS.map(function (step, i) {
      if (i === a) return { step: step, hex: hex };
      var t = STEP_L[i], nl, frac;
      if (i < a) { nl = l + (t - La) / (97 - La) * (Math.max(l, 97) - l); frac = (t - La) / (97 - La); }
      else { nl = l - (La - t) / (La - 14) * (l - Math.min(l, 14)); frac = (La - t) / (La - 14); }
      var ns = s * (1 - (i < a ? 0.25 : 0.12) * frac);
      return { step: step, hex: hslToHex(h, Math.max(0, ns), Math.max(2, Math.min(98, nl))) };
    });
  }

  /* ---------- editor ---------- */
  function seed(n) {
    current = generate(n).map(function (h) { return { hex: h, name: "", locked: false }; });
  }
  function newPalette() {
    current = [0, 1, 2].map(function () { return { hex: "#ffffff", name: "", locked: false }; });
    editingId = null;
    renderStrip(); renderSaved(); renderEditing();
    toast("New palette");
  }
  function regenerate() {
    var locked = current.filter(function (c) { return c.locked; });
    var free = current.length - locked.length;
    if (!free) { toast("All colors are locked"); return; }
    var fresh = generate(current.length, locked.length ? hexToHue(locked[0].hex) : null);
    var j = 0;
    current.forEach(function (c, i) { if (!c.locked) { c.hex = fresh[i]; } });
    renderStrip();
  }

  function renderStrip() {
    var strip = $("strip");
    strip.innerHTML = "";
    current.forEach(function (c, i) {
      var col = document.createElement("div");
      col.className = "col" + (c.locked ? " locked" : "");
      col.style.setProperty("--c", c.hex);
      col.style.setProperty("--fg", fgFor(c.hex));

      var tools = document.createElement("div");
      tools.className = "tools";
      tools.appendChild(tool("ph-lock-simple" + (c.locked ? "" : "-open"), c.locked ? "Unlock color" : "Lock color", function () {
        c.locked = !c.locked; renderStrip();
      }));
      tools.appendChild(tool("ph-pencil-simple", "Edit color", function () {
        if (picker.showPicker) { try { picker.showPicker(); return; } catch (err) {} }
        picker.click();
      }));
      tools.appendChild(tool("ph-drop", "Open color details", function () { openDetail(i); }));
      tools.appendChild(tool("ph-copy", "Copy " + c.hex, function () { copy(c.hex, "Copied " + c.hex.toUpperCase(), c.hex); }));
      if (current.length > MIN) tools.appendChild(tool("ph-x", "Remove color", function () {
        current.splice(i, 1); renderStrip();
      }));

      var hex = document.createElement("button");
      hex.className = "hex";
      hex.textContent = c.hex.replace("#", "");
      hex.setAttribute("aria-label", "Copy " + c.hex);
      hex.addEventListener("click", function () { copy(c.hex, "Copied " + c.hex.toUpperCase(), c.hex); });

      var label = document.createElement("div");
      label.className = "label";
      var name = document.createElement("input");
      name.type = "text"; name.className = "cname"; name.value = c.name || ""; name.maxLength = 30;
      name.placeholder = closestName(c.hex).name; name.autocomplete = "off"; name.spellcheck = false;
      name.setAttribute("aria-label", "Name for " + c.hex);
      name.addEventListener("input", function () { c.name = name.value; });
      name.addEventListener("keydown", function (e) { if (e.key === "Enter") name.blur(); });
      label.appendChild(name); label.appendChild(hex);

      var picker = document.createElement("input");
      picker.type = "color"; picker.value = c.hex; picker.className = "picker"; picker.tabIndex = -1;
      picker.setAttribute("aria-hidden", "true");
      picker.style.left = "50%"; picker.style.top = "40%";
      picker.addEventListener("input", function () {
        var n = normHex(picker.value);
        if (n) { c.hex = n; col.style.setProperty("--c", n); col.style.setProperty("--fg", fgFor(n)); hex.textContent = n.slice(1); name.setAttribute("aria-label", "Name for " + n); name.placeholder = closestName(n).name; }
      });

      col.appendChild(tools); col.appendChild(label); col.appendChild(picker);
      strip.appendChild(col);
    });
    $("count").textContent = current.length;
    $("minusBtn").disabled = current.length <= MIN;
    $("plusBtn").disabled = current.length >= MAX;
    $("minusBtn").style.opacity = current.length <= MIN ? .4 : 1;
    $("plusBtn").style.opacity = current.length >= MAX ? .4 : 1;
  }
  function tool(icon, label, fn) {
    var b = document.createElement("button");
    b.className = "tool"; b.dataset.icon = icon; b.setAttribute("aria-label", label); b.title = label;
    b.innerHTML = '<i class="ph ' + icon + '" aria-hidden="true"></i>';
    b.addEventListener("click", fn);
    return b;
  }

  /* ---------- saved list ---------- */
  function miniStrip(colors, interactive) {
    var m = document.createElement("div");
    m.className = "mini";
    colors.forEach(function (col) {
      var hex = col.hex;
      var b = document.createElement("button");
      b.style.setProperty("--c", hex); b.style.setProperty("--fg", fgFor(hex));
      b.innerHTML = "<span></span>";
      b.firstChild.textContent = col.name || hex.slice(1);
      b.title = (col.name ? col.name + " " : "") + hex;
      b.setAttribute("aria-label", "Copy " + (col.name ? col.name + " " : "") + hex);
      if (interactive) b.addEventListener("click", function () { copy(hex, "Copied " + hex.toUpperCase(), hex); });
      else b.tabIndex = -1;
      m.appendChild(b);
    });
    return m;
  }
  function renderSaved() {
    var root = $("saved");
    root.innerHTML = "";
    if (!saved.length) {
      var e = document.createElement("div");
      e.className = "empty";
      e.innerHTML = "<strong>No palettes yet</strong>Generate something you like, then press Save palette.";
      root.appendChild(e);
      return;
    }
    saved.forEach(function (p) {
      var card = document.createElement("article");
      card.className = "card" + (p.id === editingId ? " is-editing" : "");
      card.appendChild(miniStrip(p.colors, true));

      var foot = document.createElement("div");
      foot.className = "card-foot";
      var info = document.createElement("div");
      info.style.minWidth = "0";
      info.style.flex = "1";
      var nm = document.createElement("div"); nm.className = "card-name"; nm.textContent = p.name;
      var dt = document.createElement("div"); dt.className = "card-date";
      dt.textContent = new Date(p.ts).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
      info.appendChild(nm); info.appendChild(dt);

      var act = document.createElement("div");
      act.className = "card-actions";
      act.appendChild(cardBtn("ph-text-aa", "Rename palette", function () {
        var input = document.createElement("input");
        input.className = "name-input"; input.value = p.name; input.maxLength = 40;
        input.setAttribute("aria-label", "Palette name");
        info.replaceChild(input, nm);
        input.focus(); input.select();
        var finished = false;
        function commit(keep) {
          if (finished) return; finished = true;
          var v = input.value.trim();
          if (keep && v && v !== p.name) { p.name = v; p.updated = Date.now(); persist(); toast("Renamed to " + v); }
          renderSaved(); renderEditing();
        }
        input.addEventListener("keydown", function (e) {
          if (e.key === "Enter") commit(true); else if (e.key === "Escape") commit(false);
        });
        input.addEventListener("blur", function () { commit(true); });
      }));
      act.appendChild(cardBtn("ph-folder-open", "Open in editor", function () {
        current = p.colors.map(function (c) { return { hex: c.hex, name: c.name || "", locked: false }; });
        editingId = p.id;
        renderStrip(); renderSaved(); renderEditing(); window.scrollTo({ top: 0, behavior: "smooth" });
      }));
      act.appendChild(cardBtn("ph-code", "Copy CSS", function () { copy(cssVars(p.colors), "Copied CSS variables"); }));
      act.appendChild(cardBtn("ph-trash", "Delete palette", function () {
        var idx = saved.indexOf(p);
        saved.splice(idx, 1);
        var wasEditing = editingId === p.id;
        if (wasEditing) editingId = null;
        persist(); renderSaved(); renderEditing();
        toast("Deleted " + p.name, null, { label: "Undo", fn: function () {
          saved.splice(Math.min(idx, saved.length), 0, p);
          if (wasEditing) editingId = p.id;
          persist(); renderSaved(); renderEditing();
        } });
      }));
      foot.appendChild(info); foot.appendChild(act);
      card.appendChild(foot);
      root.appendChild(card);
    });
  }
  function cardBtn(icon, label, fn) {
    var b = document.createElement("button");
    b.className = "btn icon"; b.setAttribute("aria-label", label); b.title = label;
    b.innerHTML = '<i class="ph ' + icon + '" aria-hidden="true"></i>';
    b.addEventListener("click", fn);
    return b;
  }

  /* ---------- save dialog ---------- */
  var dlg = $("dlg");
  function findEditing() { return saved.filter(function (p) { return p.id === editingId; })[0] || null; }
  function renderEditing() {
    var p = findEditing();
    if (!p) editingId = null;
    $("editing").hidden = !p;
    if (p) $("editingName").textContent = p.name;
    $("saveBtn").lastChild.textContent = p ? "Update palette" : "Save palette";
  }
  $("saveBtn").addEventListener("click", function () {
    var p = findEditing();
    var pv = $("dlgPreview"); pv.innerHTML = "";
    pv.appendChild(miniStrip(current, false));
    $("nameInput").value = p ? p.name : "";
    $("okBtn").textContent = p ? "Update" : "Save";
    $("asNewBtn").hidden = !p;
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", "");
    $("nameInput").focus();
  });
  $("cancelBtn").addEventListener("click", function () { dlg.close(); });
  $("stopEditBtn").addEventListener("click", function () { editingId = null; renderEditing(); renderSaved(); });
  $("saveForm").addEventListener("submit", function (e) {
    var mode = e.submitter && e.submitter.dataset.mode;
    var colors = current.map(function (c) { return { hex: c.hex, name: (c.name || "").trim() }; });
    var typed = $("nameInput").value.trim();
    var p = findEditing();
    if (p && mode === "main") {
      p.name = typed || p.name; p.colors = colors; p.updated = Date.now();
      persist(); toast("Updated " + p.name);
    } else {
      var name = typed || "Palette " + (saved.length + 1);
      var np = { id: Date.now().toString(36), name: name, colors: colors, ts: Date.now() };
      saved.unshift(np); editingId = null;
      persist(); toast("Saved " + name);
    }
    renderSaved(); renderEditing();
  });

  /* ---------- controls ---------- */
  $("genBtn").addEventListener("click", regenerate);
  $("newBtn").addEventListener("click", newPalette);
  $("plusBtn").addEventListener("click", function () {
    if (current.length >= MAX) return;
    var base = current.length ? hexToHue(current[current.length - 1].hex) : null;
    current.push({ hex: generate(1, base)[0], name: "", locked: false }); renderStrip();
  });
  $("minusBtn").addEventListener("click", function () {
    if (current.length <= MIN) return;
    var idx = -1;
    for (var i = current.length - 1; i >= 0; i--) { if (!current[i].locked) { idx = i; break; } }
    if (idx < 0) { toast("Unlock a color to remove it"); return; }
    current.splice(idx, 1); renderStrip();
  });
  document.addEventListener("keydown", function (e) {
    if (e.code !== "Space" || dlg.open || !$("detail").hidden) return;
    var t = e.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "BUTTON")) return;
    e.preventDefault(); regenerate();
  });

  /* ---------- theme ---------- */
  (function () {
    var stored = null;
    try { stored = localStorage.getItem(THEME_KEY); } catch (e) {}
    if (stored) document.documentElement.setAttribute("data-theme", stored);
    $("themeBtn").addEventListener("click", function () {
      var cur = document.documentElement.getAttribute("data-theme") ||
        (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      var next = cur === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    });
  })();

  /* ---------- color details ---------- */
  var round = Math.round;
  function hexToRgb(h) { return [1, 3, 5].map(function (i) { return parseInt(h.slice(i, i + 2), 16); }); }
  function rgbToHex(r, g, b) {
    return "#" + [r, g, b].map(function (v) { return Math.max(0, Math.min(255, round(v))).toString(16).padStart(2, "0"); }).join("");
  }
  function hueOf(r, g, b, max, min) {
    var d = max - min, h = 0;
    if (d) {
      if (max === r) h = ((g - b) / d) % 6; else if (max === g) h = (b - r) / d + 2; else h = (r - g) / d + 4;
      h *= 60;
    }
    return (h + 360) % 360;
  }
  function rgbToHsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    var max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2, d = max - min;
    return [hueOf(r, g, b, max, min), d ? d / (1 - Math.abs(2 * l - 1)) * 100 : 0, l * 100];
  }
  function rgbToHsb(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    var max = Math.max(r, g, b), min = Math.min(r, g, b);

  });
  $("dBody").addEventListener("click", function (e) {
    var t = e.target.closest("[data-copy],[data-view],[data-pal],[data-val],[data-scale-copy]");
    if (!t) return;
    if (t.dataset.scaleCopy) {
      if (t.dataset.scaleCopy === "one") copy(scaleCss(scalePrefixFor(dViewed), dViewed), "Copied scale CSS");
      else {
        var cols = current.map(function (c, i) { return i === dIdx ? { hex: dViewed, name: $("dName").value } : c; });
        copy(cssVars(cols, true), "Copied all scales as CSS");
      }
    }
    else if (t.dataset.copy) copy(t.dataset.copy, "Copied " + t.dataset.copy.toUpperCase(), t.dataset.copy);
    else if (t.dataset.view) { dViewed = t.dataset.view; renderHero(); renderBody(); }
    else if (t.dataset.val) copy(t.dataset.val, "Copied " + t.dataset.val);
    else if (t.dataset.pal) {
      current = t.dataset.pal.split(",").map(function (h) { return { hex: h, name: "", locked: false }; });
      editingId = null;
      renderStrip(); renderSaved(); renderEditing(); closeDetail();
      toast("Palette created from harmony");
    }
  });

  seed(5);
  renderStrip();
  renderSaved();
  renderEditing();
})();
</script>
</body>
</html>
